<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Gym App</title>

    <!--FONTAWESOME-->
    <script src="https://kit.fontawesome.com/e9987e6d2b.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>


    <!--BOOTSTRAP ICONS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!--SCROLLREVEAL-->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">


    <!-- CSS do projeto -->
    <link rel="stylesheet" href="meuTreino.css">

</head>


<body>
    <div class="row">
        <div class="col">
            <div class="row my-5">
                <div class="col flexCenter">
                    <div class="alert alert-warning w-75 textoCenter uppercase">
                        <h4 class="display-4">Track Gym</h4>
                    </div>
                </div>
            </div>
            <div class="row m-3 textoCenter">
                <div class="col-6 mb-2">
                    <button class="btn btn-sm btn-danger w-100 buttonHeight4"
                    id="btnCadastrarExercicio"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTreino"
                    onclick="abreModal('Cadastrar Exercício')">
                        <i class="fa fa-circle-plus"></i>&nbsp;&nbsp;
                        <span class="font-button">Cadastrar exercicio</span>
                    </button>
                </div>
                <div class="col-6 mb-2">
                    <button class="btn btn-sm btn-success w-100 buttonHeight4"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTreino"
                    onclick="abreModal('Cadastrar Ficha'),
                    atualizaQtdTreinos(3),
                    mostraDataAtual('dataCadastroNovaFicha'),
                    mostraDataAtual('dataInicioNovaFicha')">
                        <i class="fa fa-circle-plus"></i>&nbsp;&nbsp;
                        <span class="font-button">Cadastrar ficha</span>
                    </button>
                </div>
                <div class="col-12 mb-2">
                    <button class="btn btn-sm btn-warning w-100 buttonHeight4">
                        <i class="fa-solid fa-chart-simple"></i>&nbsp;&nbsp;
                        <span class="font-button">Evolução de Condicionamento</span>
                    </button>
                </div>
                <div class="col-12 mb-2">
                    <button class="btn btn-sm btn-primary w-100 buttonHeight4"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTreino"
                    onclick="abreModal('Meus Exercícios Cadastrados')">
                        <i class="fa-solid fa-dumbbell"></i>&nbsp;&nbsp;
                        <span class="font-button">exercícios cadastrados</span>
                    </button>
                </div>
                <div class="col-12 mb-2">
                    <button class="btn btn-sm btn-dark w-100 buttonHeight4"
                    onclick="abreModal('Minhas Fichas de Treinamento')"
                    data-bs-toggle="modal"
                    data-bs-target="#modalTreino">
                        <i class="fa-regular fa-clipboard"></i>&nbsp;&nbsp;
                        <span class="font-button">minha ficha de treinamento</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="modal" tabindex="-1" id="modalTreino">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header" id="tituloModal"></div>
                        <div class="modal-body" id="modalBody"></div>
                        <div class="modal-footer" id="modalFooter"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1200,
            once: true
        });
    </script>

    <script src="/js/meuTreino.js" defer></script>


</body>

</html>
